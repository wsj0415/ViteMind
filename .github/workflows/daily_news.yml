name: Daily AI News

on:
  schedule:
    # Daily at 08:00 Asia/Shanghai (UTC+8)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    # Pin the runner image so OS upgrades cannot break Python setup.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser supabase openai python-dotenv google-generativeai

      - name: Generate News
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/generate_news.py

      - name: Upload review draft
        uses: actions/upload-artifact@v4
        with:
          name: news-review-${{ github.run_id }}
          path: output/news-review/draft.json
          if-no-files-found: error
          retention-days: 14
